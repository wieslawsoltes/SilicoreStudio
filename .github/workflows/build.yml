name: Validate and build Silicore Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silicore-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import the initial source transfer
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, lzma, os
          from pathlib import Path, PurePosixPath
          manifest = Path('.bootstrap/manifest.json')
          imported = False
          if not Path('package.json').exists() and manifest.exists():
              meta = json.loads(manifest.read_text())
              packed = b''.join(Path('.bootstrap', part).read_bytes() for part in meta['parts'])
              assert len(packed) == meta['size'], 'Transfer size mismatch'
              assert hashlib.sha256(packed).hexdigest() == meta['sha256'], 'Transfer checksum mismatch'
              files = json.loads(lzma.decompress(packed))
              for name, text in files.items():
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in ('.git', '.github'), name
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(text, encoding='utf-8')
              imported = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"ready={str(Path('package.json').exists()).lower()}\n")
              output.write(f"imported={str(imported).lower()}\n")
          PY
      - name: Syntax validation
        if: steps.source.outputs.ready == 'true'
        run: |
          node --check src/core.js
          node --check src/renderer.js
          node --check src/app.js
          node --check src/worker.js
      - name: Kernel tests
        if: steps.source.outputs.ready == 'true'
        run: npm test
      - name: Build standalone app and reference project
        if: steps.source.outputs.ready == 'true'
        run: |
          npm run build
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {createDemo} from './src/core.js'; writeFileSync('examples/aurora.silicore', JSON.stringify(createDemo(), null, 2));"
      - name: Install browser verification tools
        if: steps.source.outputs.imported == 'true'
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Browser checks and workspace screenshots
        if: steps.source.outputs.imported == 'true'
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/silicore-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          BROWSER=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python3 tests/browser_smoke.py --url http://127.0.0.1:8765 --browser "$BROWSER" --output test-results/browser
          mkdir -p assets
          cp test-results/browser/01-layout.png assets/layout.png
          cp test-results/browser/02-schematic.png assets/schematic.png
          cp test-results/browser/03-rtl.png assets/rtl-editor.png
          cp test-results/browser/04-waveforms.png assets/waveforms.png
          cp test-results/browser/05-compact.png assets/compact-layout.png
      - name: Commit verified initial source and generated artifacts
        if: steps.source.outputs.imported == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Add complete Silicore Studio source, tests, examples and standalone build'
          git push origin HEAD:main
      - name: Upload standalone build
        if: steps.source.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: silicore-studio
          path: dist/silicore-studio.html
