name: Validate and publish Silicore Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: silicore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax validation
        run: |
          node --check src/core.js
          node --check src/renderer.js
          node --check src/app.js
          node --check src/worker.js
      - name: Kernel tests
        run: npm test
      - name: Build standalone application
        run: npm run build
      - name: Install browser verification tools
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Test the standalone application over HTTP
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/silicore-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break || sleep 1; done
          BROWSER=$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          python3 tests/browser_smoke.py --url http://127.0.0.1:8765/dist/silicore-studio.html --browser "$BROWSER" --output /tmp/silicore-browser
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: /tmp/silicore-browser
          if-no-files-found: ignore
      - name: Stage the verified website
        run: |
          mkdir -p _site
          cp dist/silicore-studio.html _site/index.html
          cp LICENSE _site/LICENSE
          touch _site/.nojekyll
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          site = Path('_site')
          metadata = {
              'name': 'Silicore Studio',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sourceCommit': os.environ['GITHUB_SHA'],
              'sha256': hashlib.sha256((site / 'index.html').read_bytes()).hexdigest()
          }
          (site / 'version.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (site / 'README.md').write_text('# Silicore Studio - GitHub Pages\n\nThis branch contains the verified standalone build from main. See version.json for source provenance.\n\nhttps://wieslawsoltes.github.io/SilicoreStudio/\n')
          PY
      - name: Upload the verified website
        uses: actions/upload-artifact@v4
        with:
          name: silicore-site
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    steps:
      - name: Check out the publishing branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: deployment
      - name: Download the verified website
        uses: actions/download-artifact@v4
        with:
          name: silicore-site
          path: _site
      - name: Update the publishing branch
        shell: bash
        run: |
          cp _site/index.html _site/LICENSE _site/version.json _site/README.md deployment/
          touch deployment/.nojekyll
          cd deployment
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html LICENSE version.json README.md .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish Silicore Studio from ${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN pushes do not trigger Pages automatically; request it explicitly.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Verify the live HTTPS deployment and content integrity
        env:
          SOURCE_SHA: ${{ github.sha }}
          SITE_URL: https://wieslawsoltes.github.io/SilicoreStudio/
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          expected = json.loads(Path('_site/version.json').read_text())
          base = os.environ['SITE_URL']
          def get(path):
              request = Request(base + path, headers={'Cache-Control': 'no-cache', 'User-Agent': 'SilicoreStudio-CI'})
              with urlopen(request, timeout=20) as response:
                  assert response.status == 200, response.status
                  return response.read()
          for attempt in range(60):
              try:
                  suffix = '?revision=' + os.environ['SOURCE_SHA'] + '&attempt=' + str(attempt)
                  version = json.loads(get('version.json' + suffix))
                  assert version['sourceCommit'] == expected['sourceCommit'], 'An older version is still being served'
                  page = get(suffix)
                  assert hashlib.sha256(page).hexdigest() == expected['sha256'], 'Published HTML differs from the tested artifact'
                  print('LIVE HTTPS VERIFIED:', base)
                  print('SOURCE COMMIT:', version['sourceCommit'])
                  print('HTML SHA256:', expected['sha256'])
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write(f"## Published Silicore Studio\n\n[Open the app]({base})\n\nSource: `{version['sourceCommit']}`\n\nLive HTML SHA-256 matches the tested artifact.\n")
                  break
              except Exception as error:
                  print(f'Propagation check {attempt + 1}/60: {error}')
                  if attempt == 59:
                      raise
                  time.sleep(5)
          PY
